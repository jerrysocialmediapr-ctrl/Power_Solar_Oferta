<svg viewBox="0 0 300 160" xmlns="http://www.w3.org/2000/svg">
  <!-- Línea horizontal base -->
  <line x1="10" y1="100" x2="140" y2="100" stroke="#E8560E" stroke-width="10" stroke-linecap="round"/>
  
  <!-- Arco del sol de 270 grados -->
  <path d="M 160,100 A 40,40 0 1,1 200,140" fill="none" stroke="#E8560E" stroke-width="10" stroke-linecap="round"/>
  
  <!-- 5 Rayos del sol -->
  <!-- Arriba izquierda (135 grados) -->
  <line x1="161" y1="61" x2="147" y2="47" stroke="#E8560E" stroke-width="10" stroke-linecap="round"/>
  
  <!-- Arriba centro (90 grados) -->
  <line x1="200" y1="45" x2="200" y2="25" stroke="#E8560E" stroke-width="10" stroke-linecap="round"/>
  
  <!-- Arriba derecha (45 grados) -->
  <line x1="239" y1="61" x2="253" y2="47" stroke="#E8560E" stroke-width="10" stroke-linecap="round"/>
  
  <!-- Derecha horizontal (0 grados) -->
  <line x1="255" y1="100" x2="275" y2="100" stroke="#E8560E" stroke-width="10" stroke-linecap="round"/>
  
  <!-- Abajo derecha (-45 grados) -->
  <line x1="239" y1="139" x2="253" y2="153" stroke="#E8560E" stroke-width="10" stroke-linecap="round"/>
</svg>
