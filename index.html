<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ofertas Power Solar PR</title>
</head>

<body>

<div id="formWrap">
<form id="mainForm" onsubmit="handleForm(event)">

<input type="hidden" name="access_key" value="TU_WEB3FORMS_KEY">
<input type="hidden" name="leadSource" value="Power Solar Ofertas">

<input type="text" name="nombre" placeholder="Nombre completo" required>
<input type="tel" name="telefono" placeholder="Teléfono" required>
<input type="email" name="email" placeholder="Email">

<select name="municipio" required>
<option value="">Selecciona tu pueblo</option>
<option>San Juan</option>
<option>Bayamón</option>
<option>Carolina</option>
<option>Ponce</option>
</select>

<select name="necesidad" required>
<option value="">¿Qué necesitas?</option>
<option>Instalar sistema nuevo</option>
<option>Expandir sistema actual</option>
<option>Baterías</option>
</select>

<button class="f-submit" type="submit">
<span class="btn-shine"></span>
Solicitar cotización gratuita →
</button>

</form>
</div>

<div id="fSuccess" style="display:none;">
<h2>¡Recibimos tu información!</h2>
<p>Te estaremos contactando pronto.</p>
</div>

<script>
const GOOGLE_SHEETS_URL = "https://script.google.com/macros/s/AKfycbwc0kmpjBfmierUxYzIWkfpzvY9ydeGkdbz9QSgYnyMiDVu7dwNnxG_Pl7F7BcicRDa/exec";

// FORM SUBMIT
async function handleForm(e){
  e.preventDefault();

  const form = document.getElementById('mainForm');
  const btn = form.querySelector('.f-submit');
  const formData = new FormData(form);

  btn.innerHTML = '<span class="btn-shine"></span>Enviando...';
  btn.disabled = true;

  try{

    // 1) ENVÍO A WEB3FORMS
    const web3Response = await fetch('https://api.web3forms.com/submit', {
      method: 'POST',
      body: formData
    });

    // 2) ENVÍO A GOOGLE SHEETS (MISMA TABLA)
    const params = new URLSearchParams({
      Nombre: form.nombre?.value || '',
      Telefono: form.telefono?.value || '',
      Email: form.email?.value || '',
      Municipio: form.municipio?.value || '',
      Servicio: form.necesidad?.value || '',
      leadSource: 'Power Solar Ofertas'
    });

    await fetch(`${GOOGLE_SHEETS_URL}?${params.toString()}`, {
      method: 'GET',
      mode: 'no-cors'
    });

    // SUCCESS
    if(web3Response.ok){
      document.getElementById('formWrap').style.display = 'none';
      document.getElementById('fSuccess').style.display = 'block';
    } else {
      throw new Error("Web3Forms falló");
    }

  } catch(err){
    console.error(err);
    alert('Error enviando formulario');
    btn.innerHTML = '<span class="btn-shine"></span>Solicitar cotización gratuita →';
    btn.disabled = false;
  }
}
</script>

</body>
</html>
