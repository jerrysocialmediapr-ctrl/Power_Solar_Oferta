<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ofertas Power Solar PR | Paneles 595W | $0 Pronto</title>

<meta name="description" content="Expande tu sistema solar o instala desde $0 pronto con paneles de 595W en Puerto Rico.">
<link rel="canonical" href="https://ofertas.powersolarprr.com">

<!-- Open Graph -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://ofertas.powersolarprr.com">
<meta property="og:title" content="Power Solar PR | Ofertas">
<meta property="og:description" content="Cotiza gratis tu sistema solar">
<meta property="og:image" content="https://ofertas.powersolarprr.com/logo.png">

<style>
body {
  font-family: Arial, sans-serif;
  margin:0;
  background:#0b1a2b;
  color:white;
}

.container {
  max-width:600px;
  margin:auto;
  padding:20px;
}

h1 {
  text-align:center;
  color:#00d4ff;
}

input, select {
  width:100%;
  padding:12px;
  margin:8px 0;
  border-radius:8px;
  border:none;
}

button {
  width:100%;
  padding:15px;
  background:#00d4ff;
  color:black;
  border:none;
  border-radius:10px;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
}

.success {
  display:none;
  text-align:center;
  margin-top:20px;
}
</style>
</head>

<body>

<div class="container">
  <h1>Solicita tu Cotización</h1>

  <form id="leadForm">
    <input type="text" name="nombre" placeholder="Nombre completo" required>
    <input type="tel" name="telefono" placeholder="Teléfono" required>
    <input type="email" name="email" placeholder="Email">

    <select name="municipio" required>
      <option value="">Selecciona tu pueblo</option>
      <option>San Juan</option>
      <option>Bayamón</option>
      <option>Carolina</option>
      <option>Ponce</option>
    </select>

    <select name="necesidad" required>
      <option value="">¿Qué necesitas?</option>
      <option>Instalar sistema nuevo</option>
      <option>Expandir sistema actual</option>
      <option>Baterías</option>
    </select>

    <button type="submit">Solicitar cotización</button>
  </form>

  <div class="success" id="successMsg">
    <h2>¡Recibimos tu información!</h2>
    <p>Te estaremos contactando pronto.</p>
  </div>
</div>

<script>
const GOOGLE_SHEETS_URL = "https://script.google.com/macros/s/AKfycbwc0kmpjBfmierUxYzIWkfpzvY9ydeGkdbz9QSgYnyMiDVu7dwNnxG_Pl7F7BcicRDa/exec";

document.getElementById("leadForm").addEventListener("submit", async function(e){
  e.preventDefault();

  const form = e.target;
  const data = new URLSearchParams({
    Nombre: form.nombre.value,
    Telefono: form.telefono.value,
    Email: form.email.value,
    Municipio: form.municipio.value,
    Servicio: form.necesidad.value,
    leadSource: "Power Solar Ofertas"
  });

  try {
    await fetch(`${GOOGLE_SHEETS_URL}?${data.toString()}`, {
      method: "GET",
      mode: "no-cors"
    });

    form.style.display = "none";
    document.getElementById("successMsg").style.display = "block";

  } catch (err) {
    alert("Error enviando formulario");
    console.error(err);
  }
});
</script>

</body>
</html>
